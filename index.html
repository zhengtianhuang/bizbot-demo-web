<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Assistant Demo</title>
<style>
  :root { --accent: #c9622f; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #f4f1ec;
    font-family: -apple-system, system-ui, sans-serif; color: #2b2b2b;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .phone {
    width: 100%; max-width: 400px; height: 640px; background: #fff; border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid #eee;
  }
  .header {
    background: var(--accent); color: #fff; padding: 18px 20px; text-align: center;
  }
  .header h1 { font-size: 1.05rem; margin: 0; }
  .header p { font-size: 0.8rem; margin: 2px 0 0; opacity: 0.9; }
  .badge {
    display: inline-block; font-size: 0.65rem; background: rgba(255,255,255,0.25);
    padding: 2px 8px; border-radius: 10px; margin-top: 6px;
  }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; line-height: 1.4; }
  .msg.bot { background: #f0ece4; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.typing { background: #f0ece4; align-self: flex-start; color: #999; font-style: italic; }
  .input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #eee; }
  input[type=text] {
    flex: 1; padding: 12px 14px; border-radius: 20px; border: 1px solid #ddd; font-size: 0.9rem; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 20px; padding: 0 18px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .footer-note { text-align: center; font-size: 0.7rem; color: #999; padding-bottom: 10px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <h1 id="bizName">Loading…</h1>
      <p id="bizTagline"></p>
      <span class="badge">🤖 AI Assistant Demo</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input id="input" type="text" placeholder="Ask a question…" maxlength="500">
      <button id="sendBtn">Send</button>
    </div>
    <div class="footer-note">Demo build — answers only from this business's FAQ</div>
  </div>

<script>
// This page is hosted on GitHub Pages so a fresh visitor never hits
// ngrok's free-tier browser-warning interstitial on page load — that
// interstitial's own injected JS was observed crashing outright
// (createRoot is not a function) and leaving a blank page for anyone who
// opened the demo link directly off the ngrok domain. Only the API calls
// below go to ngrok now, with the skip-warning header, which bypasses the
// interstitial for fetch/XHR calls (it only ever applied to full page
// loads anyway). Update API_BASE if the ngrok domain ever changes.
const API_BASE = 'https://tomasa-vestigial-compositely.ngrok-free.dev';
const SKIP_WARNING_HEADERS = { 'ngrok-skip-browser-warning': 'true' };

let history = [];

// The demo server sits behind ngrok and is occasionally restarted by a
// watchdog (~1-2 min). While it's down ngrok answers with an HTML error page
// or a 502/503/504, so retry those quietly instead of showing an error.
const RETRY_DELAYS_MS = [3000, 6000, 10000];

async function fetchJsonWithRetry(url, options, onRetry) {
  for (let attempt = 0; ; attempt++) {
    try {
      const r = await fetch(url, options);
      const isJson = (r.headers.get('content-type') || '').includes('application/json');
      if (isJson && ![502, 503, 504].includes(r.status)) return { r, data: await r.json() };
    } catch (e) { /* network error: fall through to retry */ }
    if (attempt >= RETRY_DELAYS_MS.length) throw new Error('server unavailable');
    if (onRetry) onRetry(attempt + 1);
    await new Promise((res) => setTimeout(res, RETRY_DELAYS_MS[attempt]));
  }
}

async function loadConfig() {
  const { data: cfg } = await fetchJsonWithRetry(`${API_BASE}/bizbot-demo/api/config`, { headers: SKIP_WARNING_HEADERS });
  document.getElementById('bizName').textContent = cfg.business_name;
  document.getElementById('bizTagline').textContent = cfg.tagline;
  document.documentElement.style.setProperty('--accent', cfg.accent_color || '#c9622f');
  addMessage('bot', `Hi! I'm the AI assistant for ${cfg.business_name}. Ask me anything — hours, menu, location, you name it.`);
}

function addMessage(role, text) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.textContent = text;
  const container = document.getElementById('messages');
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
  return el;
}

async function send() {
  const input = document.getElementById('input');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text) return;
  addMessage('user', text);
  history.push({ role: 'user', text });
  input.value = '';
  btn.disabled = true;

  const typingEl = addMessage('typing', 'Typing…');
  typingEl.classList.add('typing');

  try {
    const { r, data } = await fetchJsonWithRetry(`${API_BASE}/bizbot-demo/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...SKIP_WARNING_HEADERS },
      body: JSON.stringify({ message: text, history }),
    }, (n) => { typingEl.textContent = `Demo server is waking up, retrying (${n}/${RETRY_DELAYS_MS.length})…`; });
    typingEl.remove();
    if (!r.ok) {
      addMessage('bot', data.error || 'Something went wrong.');
    } else {
      addMessage('bot', data.reply);
      history.push({ role: 'assistant', text: data.reply });
    }
  } catch (e) {
    typingEl.remove();
    addMessage('bot', 'The demo server is temporarily offline. Please try again in a minute.');
  }
  btn.disabled = false;
  input.focus();
}

document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
loadConfig().catch(() => addMessage("bot", "The demo server is temporarily offline. Please refresh in a minute."));
</script>
</body>
</html>
